<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>The Curated Lens - Access</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@400;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "inverse-on-surface": "#f4eff5",
                    "primary": "#680005",
                    "surface-container-lowest": "#ffffff",
                    "tertiary-fixed": "#dbe1ff",
                    "primary-container": "#92000a",
                    "tertiary-container": "#003ea6",
                    "surface-dim": "#ddd9de",
                    "error": "#ba1a1a",
                    "tertiary": "#002a76",
                    "on-tertiary-fixed": "#00174a",
                    "on-secondary-container": "#752721",
                    "surface-bright": "#fdf8fd",
                    "on-primary-fixed-variant": "#93010b",
                    "background": "#fdf8fd",
                    "on-secondary": "#ffffff",
                    "tertiary-fixed-dim": "#b3c5ff",
                    "on-error-container": "#93000a",
                    "outline": "#8f706c",
                    "primary-fixed-dim": "#ffb4ab",
                    "secondary-fixed-dim": "#ffb4ab",
                    "on-tertiary-container": "#99b2ff",
                    "on-background": "#1c1b1f",
                    "on-primary-container": "#ff988d",
                    "on-surface": "#1c1b1f",
                    "primary-fixed": "#ffdad6",
                    "on-secondary-fixed-variant": "#7c2c25",
                    "surface": "#fdf8fd",
                    "secondary": "#9b433b",
                    "on-tertiary": "#ffffff",
                    "surface-container-low": "#f7f2f8",
                    "on-surface-variant": "#5a403d",
                    "surface-container-high": "#ebe7ec",
                    "error-container": "#ffdad6",
                    "inverse-primary": "#ffb4ab",
                    "on-primary": "#ffffff",
                    "secondary-fixed": "#ffdad6",
                    "inverse-surface": "#313034",
                    "on-secondary-fixed": "#400102",
                    "on-error": "#ffffff",
                    "secondary-container": "#fd8f83",
                    "surface-container": "#f1ecf2",
                    "surface-container-highest": "#e5e1e7",
                    "surface-tint": "#b62320",
                    "outline-variant": "#e3beba",
                    "surface-variant": "#e5e1e7",
                    "on-primary-fixed": "#410002",
                    "on-tertiary-fixed-variant": "#013ea6"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {},
            "fontFamily": {
                    "headline": ["Manrope"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen antialiased flex flex-col md:flex-row">
<!-- Left Panel: Cinematic Brand Identity -->
<div class="hidden md:flex w-1/2 relative bg-surface-container-high overflow-hidden">
<div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&amp;w=2070&amp;auto=format&amp;fit=crop')] bg-cover bg-center" data-alt="dramatic empty cinema theater with plush red velvet seats under dim moody spotlighting creating a sense of prestige and anticipation">
</div>
<!-- Gradient Overlay for readability -->
<div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent"></div>
<div class="relative z-10 flex flex-col justify-end p-16 w-full text-white/90">
<h1 class="font-headline font-extrabold text-5xl tracking-tighter mb-4 text-white">The Curated Lens</h1>
<p class="font-body text-lg max-w-md font-medium text-white/80 leading-relaxed">
                Prestige Management.<br/>
                Curating the world's most vital cinematic experiences.
            </p>
</div>
</div>
<!-- Right Panel: Interaction Canvas -->
<div class="w-full md:w-1/2 flex items-center justify-center p-8 lg:p-24 bg-surface">
<div class="w-full max-w-sm space-y-12">
<!-- Mobile Brand Header (Hidden on Desktop) -->
<div class="md:hidden text-center mb-8">
<h1 class="font-headline font-extrabold text-3xl tracking-tighter text-primary">The Curated Lens</h1>
</div>
<!-- Header -->
<div class="space-y-2">
<h2 class="font-headline font-bold text-3xl tracking-tight text-on-surface">Welcome Back</h2>
<p class="font-body text-sm text-on-surface-variant">Enter your credentials to access the archive.</p>
</div>
<!-- Tabbed Interaction (Visual only) -->
<div class="bg-surface-container-low p-1.5 rounded-full flex shadow-sm">
<button class="flex-1 bg-surface-container-lowest text-primary font-bold py-2.5 rounded-full text-sm tracking-wide shadow-[0px_4px_12px_rgba(28,27,31,0.04)] transition-all">
                    Login
                </button>
<button class="flex-1 text-on-surface-variant font-medium py-2.5 rounded-full text-sm hover:text-on-surface transition-colors">
                    Register
                </button>
</div>
<!-- Form Area -->
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="block font-label text-xs font-semibold uppercase tracking-wider text-on-surface-variant" for="email">
                        Email Address
                    </label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-xl pointer-events-none">mail</span>
<input class="w-full pl-11 pr-4 py-3.5 bg-surface-container-low text-on-surface font-body text-sm border-0 rounded-lg focus:bg-surface-container-lowest focus:ring-1 focus:ring-primary/40 focus:outline-none transition-all duration-300 placeholder:text-on-surface-variant/40" id="email" placeholder="archivist@curatedlens.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="block font-label text-xs font-semibold uppercase tracking-wider text-on-surface-variant" for="password">
                            Password
                        </label>
<a class="font-label text-xs font-medium text-primary hover:text-primary-container transition-colors" href="#">Recover?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-xl pointer-events-none">lock</span>
<input class="w-full pl-11 pr-4 py-3.5 bg-surface-container-low text-on-surface font-body text-sm border-0 rounded-lg focus:bg-surface-container-lowest focus:ring-1 focus:ring-primary/40 focus:outline-none transition-all duration-300 placeholder:text-on-surface-variant/40" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary CTA -->
<div class="pt-4">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-full py-4 font-headline font-bold text-sm tracking-wide shadow-[0px_12px_32px_rgba(104,0,5,0.15)] hover:shadow-[0px_16px_40px_rgba(104,0,5,0.2)] hover:-translate-y-0.5 transition-all duration-300" type="button">
                        Access Archive
                    </button>
</div>
<!-- Divider (Ghost pattern) -->
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink-0 mx-4 font-label text-xs text-on-surface-variant/60 uppercase tracking-widest">or</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Secondary Action (SSO) -->
<button class="w-full bg-surface-container-highest text-on-surface rounded-full py-3.5 font-label text-sm font-medium hover:bg-surface-dim transition-colors flex items-center justify-center gap-3" type="button">
<svg class="w-5 h-5 opacity-80" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Continue with Workspace
                </button>
</form>
</div>
</div>
</body></html>
