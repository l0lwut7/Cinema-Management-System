<form action="{{ search_url }}" method="get" class="rounded-3xl border border-white/10 bg-white/5 p-3 shadow-2xl shadow-black/10 backdrop-blur">
  <div class="flex flex-col gap-3 md:flex-row md:items-center">
    <div class="flex-1 rounded-2xl border border-white/10 bg-slate-950/50 px-4 py-3">
      <label class="mb-2 block text-[11px] font-semibold uppercase tracking-[0.22em] text-slate-500">Quick Search</label>
      <input type="search" name="q" placeholder="Search movies, genres, or theaters" value="{{ query|default('') }}" class="w-full bg-transparent text-sm text-white placeholder:text-slate-500 focus:outline-none" />
    </div>
    <button type="submit" class="rounded-2xl bg-brand-red px-5 py-3 text-sm font-semibold text-white transition hover:bg-rose-600">Search</button>
  </div>
</form>
