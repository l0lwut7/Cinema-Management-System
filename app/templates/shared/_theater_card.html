{% if card_classes is not defined %}
    {% set card_classes = '' %}
{% endif %}
<div class="theater-card bg-cinema-surface rounded-xl p-6 cursor-pointer hover:ring-2 hover:ring-cinema-primary transition-all {{ 'ring-2 ring-cinema-primary' if is_selected else '' }} {{ card_classes }}">
    <div class="flex items-start justify-between mb-3 gap-3">
        <div>
            <h3 class="font-heading text-xl font-semibold">{{ theater.name }}</h3>
            <p class="text-cinema-muted text-sm">{{ theater.address }}</p>
        </div>
        <span class="px-2 py-1 {% if theater.status == 'Open' %}bg-green-500/20 text-green-400{% else %}bg-cinema-secondary/20 text-cinema-secondary{% endif %} text-xs rounded-full">{{ theater.status }}</span>
    </div>
    <div class="flex items-center gap-4 text-sm text-cinema-muted">
        <span class="flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
            </svg>
            {{ theater.screens }} Saloon{{ '' if theater.screens == 1 else 's' }}
        </span>
        <span class="flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            {{ theater.distance }}
        </span>
    </div>
</div>
