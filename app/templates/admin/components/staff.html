<!-- Staff Panel -->
<div id="panel-staff" class="content-panel">
  <header class="mb-8">
    <h2 class="font-display text-3xl font-bold text-white tracking-wide">STAFF MANAGEMENT</h2>
    <p class="text-slate-400 mt-1">Manage employee roles and permissions</p>
  </header>
  
  <div class="grid grid-cols-1 gap-6">
    
    <!-- Employee List -->
    <div>
      <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
        <div class="p-6 border-b border-slate-700 flex items-center justify-between">
          <h3 class="font-display text-lg font-semibold text-white">EMPLOYEE LIST</h3>
          <button id="btn-add-employee" class="btn-primary px-4 py-2 rounded-lg text-white text-sm font-medium flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Add Employee
          </button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-slate-700/50">
              <tr>
                <th class="px-6 py-4 text-left text-xs font-semibold text-slate-300 uppercase tracking-wider">Employee</th>
                <th class="px-6 py-4 text-left text-xs font-semibold text-slate-300 uppercase tracking-wider">Role</th>
                <th class="px-6 py-4 text-left text-xs font-semibold text-slate-300 uppercase tracking-wider">Auth Level</th>
                <th class="px-6 py-4 text-left text-xs font-semibold text-slate-300 uppercase tracking-wider">Salary</th>
                <th class="px-6 py-4 text-left text-xs font-semibold text-slate-300 uppercase tracking-wider">Actions</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-700">
              {% for emp in employees %}
              <tr class="table-row transition-colors">
                <td class="px-6 py-4">
                  <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-{{ emp.color }}/20 flex items-center justify-center">
                      <span class="text-{{ emp.color }} font-bold text-sm">{{ emp.initials }}</span>
                    </div>
                    <p class="text-white font-medium">{{ emp.name }}</p>
                  </div>
                </td>
                <td class="px-6 py-4 text-slate-300">{{ emp.role }}</td>
                <td class="px-6 py-4"><span class="px-2 py-1 bg-{{ emp.auth_color }}/20 text-{{ emp.auth_color }} rounded text-xs font-medium">{{ emp.auth_level }}</span></td>
                <td class="px-6 py-4 text-slate-300">{{ emp.salary }}</td>
                <td class="px-6 py-4">
                  <button class="text-sky hover:text-sky/80 text-sm font-medium btn-edit-employee">Edit</button>
                </td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Employee Modal -->
<div id="modal-employee" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
  <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md overflow-hidden shadow-2xl scale-95 opacity-0 transition-all duration-200" id="modal-employee-content">
    <div class="p-6 border-b border-slate-700 flex justify-between items-center bg-slate-800/50">
      <h3 class="font-display text-xl font-bold text-white tracking-wide" id="modal-employee-title">ADD EMPLOYEE</h3>
      <button class="text-slate-400 hover:text-white transition-colors modal-close">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
    <div class="p-6">
      <form id="form-employee" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Full Name</label>
          <input type="text" required placeholder="e.g. John Doe" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-3 px-4 text-white placeholder-slate-500 focus:border-crimson focus:ring-1 focus:ring-crimson transition-all outline-none">
        </div>
        
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Role</label>
          <input type="text" required placeholder="e.g. Cashier" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-3 px-4 text-white placeholder-slate-500 focus:border-crimson focus:ring-1 focus:ring-crimson transition-all outline-none">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Auth Level</label>
            <select class="w-full bg-slate-900 border border-slate-700 rounded-lg py-3 px-4 text-white placeholder-slate-500 focus:border-crimson focus:ring-1 focus:ring-crimson transition-all outline-none">
                <option>Staff</option>
                <option>Moderator</option>
                <option>Admin</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Salary ($)</label>
            <input type="text" required placeholder="e.g. 40,000" class="w-full bg-slate-900 border border-slate-700 rounded-lg py-3 px-4 text-white placeholder-slate-500 focus:border-crimson focus:ring-1 focus:ring-crimson transition-all outline-none">
          </div>
        </div>
        
        <div class="pt-2 flex gap-3">
          <button type="submit" class="flex-1 bg-emerald hover:bg-emerald-600 text-white font-semibold py-3 px-4 rounded-lg shadow-lg transition-all active:scale-[0.98]">Save Employee</button>
          <button type="button" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 px-4 rounded-lg transition-all active:scale-[0.98] modal-close">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
