<!-- Catalog Panel -->
<div id="panel-catalog" class="content-panel">
  <header class="mb-8">
    <h2 class="font-display text-3xl font-bold text-white tracking-wide">CATALOG MANAGEMENT</h2>
    <p class="text-slate-400 mt-1">Manage movies, genres, and metadata</p>
  </header>
  
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- Movie Editor Form -->
    <div class="bg-slate-800 rounded-xl border border-slate-700 p-6">
      <h3 class="font-display text-lg font-semibold text-white mb-6">MOVIE EDITOR</h3>
      
      <form id="movie-form" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Movie Title <span class="text-crimson">*</span></label>
          <input type="text" placeholder="Enter movie title" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-3 text-white placeholder-slate-400">
        </div>
        
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Genres <span class="text-crimson">*</span></label>
          <p class="text-slate-400 text-xs mb-3">Select all that apply</p>
          <div class="flex flex-wrap gap-2" id="genre-chips">
            <button type="button" class="chip px-4 py-2 border border-slate-600 rounded-full text-sm text-slate-300" data-genre="action">Action</button>
            <button type="button" class="chip px-4 py-2 border border-slate-600 rounded-full text-sm text-slate-300" data-genre="comedy">Comedy</button>
            <button type="button" class="chip px-4 py-2 border border-slate-600 rounded-full text-sm text-slate-300" data-genre="drama">Drama</button>
            <button type="button" class="chip px-4 py-2 border border-slate-600 rounded-full text-sm text-slate-300" data-genre="horror">Horror</button>
            <button type="button" class="chip px-4 py-2 border border-slate-600 rounded-full text-sm text-slate-300" data-genre="scifi">Sci-Fi</button>
            <button type="button" class="chip px-4 py-2 border border-slate-600 rounded-full text-sm text-slate-300" data-genre="thriller">Thriller</button>
            <button type="button" class="chip px-4 py-2 border border-slate-600 rounded-full text-sm text-slate-300" data-genre="romance">Romance</button>
            <button type="button" class="chip px-4 py-2 border border-slate-600 rounded-full text-sm text-slate-300" data-genre="animation">Animation</button>
          </div>
        </div>
        
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Duration (min) <span class="text-crimson">*</span></label>
            <input type="number" placeholder="e.g. 120" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-3 text-white placeholder-slate-400">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-2">Format</label>
            <select class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-3 text-white">
              <option>2D</option>
              <option>3D</option>
              <option>IMAX</option>
              <option>4DX</option>
            </select>
          </div>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">Synopsis</label>
          <textarea rows="4" placeholder="Enter movie synopsis..." class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-3 text-white placeholder-slate-400 resize-none"></textarea>
        </div>
        
        <div class="flex gap-3">
          <button type="submit" class="btn-primary flex-1 px-6 py-3 rounded-lg text-white font-medium">Save Movie</button>
          <button type="button" class="btn-secondary px-6 py-3 rounded-lg text-slate-300 font-medium">Cancel</button>
        </div>
      </form>
    </div>
    
    <!-- Movie List -->
    <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
      <div class="p-6 border-b border-slate-700 flex items-center justify-between">
        <h3 class="font-display text-lg font-semibold text-white">MOVIE CATALOG</h3>
        <span class="text-slate-400 text-sm">{{ movies|length }} movies</span>
      </div>
      <div class="divide-y divide-slate-700 max-h-[600px] overflow-y-auto">
        {% for movie in movies %}
        <div class="p-4 flex items-center justify-between hover:bg-slate-700/50 transition-colors cursor-pointer">
          <div class="flex items-center gap-4">
            <div class="w-12 h-16 bg-slate-600 rounded-lg flex items-center justify-center">
              <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4"/>
              </svg>
            </div>
            <div>
              <p class="text-white font-medium">{{ movie.name }}</p>
              <div class="flex gap-2 mt-1">
                {% for genre_name, genre_color in movie.genres %}
                <span class="px-2 py-0.5 bg-{{ genre_color }}/20 text-{{ genre_color }} rounded text-xs">{{ genre_name }}</span>
                {% endfor %}
              </div>
            </div>
          </div>
          <span class="text-slate-400 text-sm">{{ movie.duration }}</span>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
