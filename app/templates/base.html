<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Cinema Management System{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cinema-bg': '#0F172A',
                        'cinema-surface': '#1E293B',
                        'cinema-primary': '#E11D48',
                        'cinema-secondary': '#F59E0B',
                        'cinema-text': '#F8FAFC',
                        'cinema-muted': '#94A3B8'
                    },
                    fontFamily: {
                        'heading': ['Oswald', 'sans-serif'],
                        'body': ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F172A;
        }
        .font-heading {
            font-family: 'Oswald', sans-serif;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-cinema-bg text-cinema-text min-h-screen flex flex-col">
    {% include 'shared/_header.html' %}

    <main class="flex-1">{% block content %}{% endblock %}</main>

    {% include 'shared/_footer.html' %}
    {% block scripts %}{% endblock %}
</body>
</html>
