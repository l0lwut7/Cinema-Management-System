<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Cinema Management System{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cinema-bg': '#0F172A',
                        'cinema-surface': '#1E293B',
                        'cinema-surfaceLight': '#334155',
                        'cinema-primary': '#E11D48',
                        'cinema-secondary': '#F59E0B',
                        'cinema-text': '#F8FAFC',
                        'cinema-muted': '#94A3B8',
                        'amber': '#F59E0B',
                        'amberLight': '#FCD34D',
                        // Aliases for booking components from index2.html
                        'background': '#0F172A',
                        'surface': '#1E293B',
                        'surfaceLight': '#334155',
                        'crimson': '#E11D48',
                        'crimsonHover': '#BE123C',
                    },
                    fontFamily: {
                        'heading': ['Oswald', 'sans-serif'],
                        'body': ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F172A;
        }
        .font-heading {
            font-family: 'Oswald', sans-serif;
        }
        .reveal-on-scroll {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 500ms ease, transform 500ms ease;
            will-change: opacity, transform;
        }
        .reveal-on-scroll.is-visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
    {% block styles %}{% endblock %}
    {% block head %}{% endblock %}
</head>
<body class="bg-cinema-bg text-cinema-text min-h-screen flex flex-col">
    {% include 'shared/_header.html' %}

    <main class="flex-1">{% block content %}{% endblock %}</main>

    {% include 'shared/_footer.html' %}
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const revealItems = document.querySelectorAll('.reveal-on-scroll');
            if (revealItems.length) {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('is-visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.12 });

                revealItems.forEach((item, index) => {
                    const delay = Number(item.dataset.revealDelay || 0);
                    item.style.transitionDelay = `${delay + index * 20}ms`;
                    observer.observe(item);
                });
            }

            const scrollCarousel = (carouselId, direction) => {
                const carousel = document.getElementById(carouselId);
                if (!carousel) return;
                const amount = Math.max(320, carousel.clientWidth * 0.8);
                carousel.scrollBy({ left: amount * direction, behavior: 'smooth' });
            };

            document.querySelectorAll('.carousel-prev, .carousel-next').forEach((button) => {
                button.addEventListener('click', () => {
                    scrollCarousel(button.dataset.carousel, Number(button.dataset.direction));
                });
            });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
