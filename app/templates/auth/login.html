<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - CineMax</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center">

<div class="w-full max-w-md bg-slate-900 rounded-2xl p-8 shadow-lg">
    <h1 class="text-3xl font-bold mb-6">Login</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="mb-4 space-y-2">
                {% for category, message in messages %}
                    <div class="p-3 rounded-lg {% if category == 'error' %}bg-red-600{% else %}bg-green-600{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
        <div>
            <label class="block text-sm text-slate-400 mb-1">Email</label>
            <input type="email" name="email" required
                   class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3">
        </div>

        <div>
            <label class="block text-sm text-slate-400 mb-1">Password</label>
            <input type="password" name="password" required
                   class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3">
        </div>

        <button type="submit"
                class="w-full bg-red-600 hover:bg-red-700 rounded-lg py-3 font-semibold">
            Login
        </button>
    </form>

    <p class="text-slate-400 mt-6 text-sm">
        Don't have an account?
        <a href="{{ url_for('auth.register') }}" class="text-red-400">Register</a>
    </p>
</div>

</body>
</html>
