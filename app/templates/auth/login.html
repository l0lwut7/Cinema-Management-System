<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CineMax</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }
        .cinema-primary { color: #ef4444; }
        .bg-cinema-primary { background-color: #ef4444; }
        .text-cinema-primary { color: #ef4444; }
        .shadow-cinema-primary\/25 { box-shadow: 0 10px 15px -3px rgba(239, 68, 68, 0.25); }
        .input-field {
            background-color: rgba(30, 41, 59, 0.8);
            border-color: rgba(71, 85, 105, 0.3);
            transition: all 0.2s;
        }
        .input-field:focus {
            background-color: rgba(30, 41, 59, 1);
            border-color: rgba(148, 163, 184, 0.5);
            outline: none;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }
    </style>
</head>

<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md">
    <!-- Auth Card -->
    <div class="glass rounded-2xl p-8 shadow-2xl">
        <h2 class="text-3xl font-bold mb-2">Welcome Back</h2>
        <p class="text-gray-400 mb-6">Sign in to access your bookings and favorites</p>
        
        <!-- Flashed Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mb-4 space-y-2">
                    {% for category, message in messages %}
                        <div class="p-3 rounded-lg {% if category == 'error' %}bg-red-500/10 border border-red-500/30 text-red-400{% else %}bg-green-500/10 border border-green-500/30 text-green-400{% endif %} text-sm">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Email Address</label>
                    <input type="email" name="email" required placeholder="you@example.com"
                           class="input-field w-full px-4 py-3 rounded-xl text-white placeholder-gray-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                    <div class="relative">
                        <input type="password" id="login-password" name="password" required placeholder="••••••••"
                               class="input-field w-full px-4 py-3 rounded-xl text-white placeholder-gray-500 pr-12">
                        <button type="button" onclick="togglePassword('login-password', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 rounded border-gray-600 bg-slate-800 text-red-600 focus:ring-red-600">
                        <span class="text-sm text-gray-400">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-red-400 hover:text-red-300 transition-colors">Forgot password?</a>
                </div>

                <button type="submit" class="w-full py-4 bg-gradient-to-r from-red-600 to-rose-600 hover:from-rose-600 hover:to-red-600 rounded-xl font-semibold text-lg transition-all transform hover:scale-[1.02] shadow-lg shadow-red-600/25">
                    Sign In
                </button>
            </div>
        </form>

        <p class="text-gray-400 mt-6 text-sm">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}" class="text-red-400 hover:text-red-300 transition-colors">Register</a>
        </p>
    </div>
</div>

<script>
    function togglePassword(inputId, button) {
        var input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            button.classList.add('text-red-400');
        } else {
            input.type = 'password';
            button.classList.remove('text-red-400');
        }
    }
</script>

</body>
</html>
