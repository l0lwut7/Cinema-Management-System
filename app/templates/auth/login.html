{% extends 'base.html' %}

{% block title %}{{ page_heading }} - CineMax{% endblock %}

{% block content %}
<div class="mx-auto flex w-full max-w-3xl flex-col gap-8 px-4 py-16 md:px-8">
    <section class="rounded-[2rem] border border-white/10 bg-white/5 p-8 text-center shadow-xl shadow-black/10">
        <p class="mb-2 text-[11px] font-semibold uppercase tracking-[0.28em] text-brand-amber">{{ page_heading }}</p>
        <h1 class="font-display text-5xl text-white">{{ page_heading }}</h1>
        <p class="mx-auto mt-4 max-w-xl text-sm leading-7 text-slate-400">{{ page_description }}</p>
        <div class="mt-8 flex flex-wrap justify-center gap-3">
            <a href="{{ url_for('discovery.home') }}" class="rounded-full bg-brand-red px-6 py-3 text-sm font-semibold text-white transition hover:bg-rose-600">Back Home</a>
            <a href="{{ url_for('discovery.now_showing') }}" class="rounded-full border border-white/10 bg-white/5 px-6 py-3 text-sm font-semibold text-white transition hover:bg-white/10">Browse Now Showing</a>
        </div>
    </section>
</div>
{% endblock %}
