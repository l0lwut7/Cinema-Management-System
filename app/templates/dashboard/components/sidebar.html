<aside class="w-64 bg-cinema-surface border-r border-slate-700 p-6 flex flex-col">
  <!-- User Profile -->
  <div class="flex items-center gap-3 pb-6 border-b border-slate-700">
    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-cinema-primary to-amber flex items-center justify-center text-lg font-bold">
      {{ user_name[0] if user_name else 'J' }}
    </div>
    <div>
      <h4 class="font-semibold">{{ user_name }}</h4>
      <p class="text-sm text-gray-400">Premium Member</p>
    </div>
  </div>
  
  <!-- Navigation -->
  <nav class="flex-1 py-6 space-y-2">
    <button onclick="switchDashboardTab('history')" id="nav-history" class="sidebar-link active w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <span>Booking History</span>
    </button>
    <button onclick="switchDashboardTab('favorites')" id="nav-favorites" class="sidebar-link w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left text-gray-400 hover:text-white hover:bg-cinema-surfaceLight/50 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
      </svg>
      <span>Favorites</span>
    </button>
    <button onclick="switchDashboardTab('profile')" id="nav-profile" class="sidebar-link w-full flex items-center gap-3 px-4 py-3 rounded-lg text-left text-gray-400 hover:text-white hover:bg-cinema-surfaceLight/50 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      </svg>
      <span>Edit Profile</span>
    </button>
  </nav>
  
  <!-- Logout -->
  <a href="{{ url_for('auth.logout') }}" class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-cinema-primary transition-colors">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
    </svg>
    <span>Sign Out</span>
  </a>
</aside>
