<!-- Partial Refund Modal -->
<div id="refund-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
  <div class="absolute inset-0 bg-cinema-bg/80 backdrop-blur-sm" onclick="hideRefundModal()"></div>
  <div class="relative glass rounded-2xl p-8 max-w-md w-full">
    <button onclick="hideRefundModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>

    <div class="text-center mb-6">
      <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-amber/20 flex items-center justify-center">
        <svg class="w-8 h-8 text-amber" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
        </svg>
      </div>
      <h3 class="font-heading text-2xl font-bold mb-1">Refund Seats</h3>
      <p class="text-gray-400 text-sm">Select the seats you want to cancel</p>
    </div>

    <!-- Booking summary -->
    <div class="bg-cinema-bg rounded-xl p-4 mb-5">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-12 h-16 rounded-lg bg-gradient-to-br from-red-600 to-orange-600 flex items-center justify-center text-xs font-bold" id="modal-movie-code">—</div>
        <div>
          <p class="font-medium" id="modal-movie-title">—</p>
          <p class="text-sm text-gray-400" id="modal-datetime">—</p>
          <p class="text-xs text-gray-500 mt-0.5">Booking <span class="text-white font-mono" id="modal-booking-code">—</span></p>
        </div>
      </div>
    </div>

    <!-- Loading spinner (shown while fetching tickets) -->
    <div id="modal-loading" class="text-center py-6">
      <svg class="w-8 h-8 mx-auto animate-spin text-cinema-primary" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
      </svg>
      <p class="text-sm text-gray-400 mt-2">Loading tickets…</p>
    </div>

    <!-- Ticket checkboxes (populated by JS) -->
    <div id="modal-ticket-list" class="hidden mb-4">
      <p class="text-sm font-medium text-gray-300 mb-3">Choose seats to refund:</p>
      <div id="modal-seat-checkboxes" class="space-y-2 max-h-40 overflow-y-auto pr-1"></div>
      <label class="flex items-center gap-2 text-sm text-gray-400 cursor-pointer mt-3">
        <input type="checkbox" id="modal-select-all" onchange="toggleModalSelectAll(this.checked)"
               class="w-4 h-4 rounded border-white/20 bg-cinema-bg text-cinema-primary focus:ring-cinema-primary">
        Select all seats
      </label>
    </div>

    <!-- Error message -->
    <div id="modal-error" class="hidden text-sm text-red-400 bg-red-500/10 rounded-xl px-4 py-3 mb-4"></div>

    <!-- Refund form -->
    <form id="refund-form" onsubmit="submitRefund(event)" class="space-y-4">
      <input type="hidden" id="refund-booking-id" value="">
      <div id="modal-form-fields" class="hidden">
        <label class="block text-sm font-medium text-gray-300 mb-2">Reason for refund</label>
        <select id="refund-reason" required class="input-field w-full px-4 py-3 rounded-xl text-white">
          <option value="">Select a reason</option>
          <option value="change_of_plans">Change of plans</option>
          <option value="wrong_date_time">Booked wrong date/time</option>
          <option value="wrong_movie">Booked wrong movie</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="flex gap-4">
        <button type="button" onclick="hideRefundModal()"
                class="flex-1 py-3 border border-white/10 rounded-xl font-medium hover:bg-cinema-surfaceLight transition-colors">
          Cancel
        </button>
        <button type="submit" id="refund-submit-btn" disabled
                class="flex-1 py-3 bg-cinema-primary hover:bg-rose-600 rounded-xl font-medium transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
          Confirm Refund
        </button>
      </div>
    </form>
  </div>
</div>
