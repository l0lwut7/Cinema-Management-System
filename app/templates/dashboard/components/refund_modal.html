<!-- Refund Modal -->
<div id="refund-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4">
  <div class="absolute inset-0 bg-cinema-bg/80 backdrop-blur-sm" onclick="hideRefundModal()"></div>
  <div class="relative glass rounded-2xl p-8 max-w-md w-full">
    <button onclick="hideRefundModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
    
    <div class="text-center mb-6">
      <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-amber/20 flex items-center justify-center">
        <svg class="w-8 h-8 text-amber" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>
      <h3 class="font-heading text-2xl font-bold mb-2">Request Refund</h3>
      <p class="text-gray-400">Are you sure you want to request a refund for this booking?</p>
    </div>
    
    <div class="bg-cinema-bg rounded-xl p-4 mb-6">
      <div class="flex items-center gap-3 mb-3">
        <div class="w-12 h-16 rounded-lg bg-gradient-to-br from-red-600 to-orange-600 flex items-center justify-center text-xs font-bold">OP</div>
        <div>
          <p class="font-medium">Oppenheimer</p>
          <p class="text-sm text-gray-400">Mar 20, 2024 • 8:00 PM</p>
        </div>
      </div>
      <div class="flex justify-between text-sm">
        <span class="text-gray-400">Seats: G12, G13, G14</span>
        <span class="font-semibold">$67.50</span>
      </div>
    </div>
    
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-2">Reason for refund</label>
        <select class="input-field w-full px-4 py-3 rounded-xl text-white">
          <option>Select a reason</option>
          <option>Change of plans</option>
          <option>Booked wrong date/time</option>
          <option>Booked wrong movie</option>
          <option>Other</option>
        </select>
      </div>
      <div class="flex gap-4">
        <button onclick="hideRefundModal()" class="flex-1 py-3 border border-white/10 rounded-xl font-medium hover:bg-cinema-surfaceLight transition-colors">
          Cancel
        </button>
        <button onclick="submitRefund()" class="flex-1 py-3 bg-cinema-primary hover:bg-rose-600 rounded-xl font-medium transition-colors">
          Confirm Refund
        </button>
      </div>
    </div>
  </div>
</div>
