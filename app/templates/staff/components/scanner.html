<!-- Booking Scanner Tab -->
<div class="flex flex-col gap-6">

  <!-- Header -->
  <div>
    <h2 class="font-display text-2xl font-bold mb-1">Booking Scanner</h2>
    <p class="text-gray-400 text-sm">Scan or type the 6-digit Booking Code to admit customers</p>
  </div>

  <!-- QR Icon + Viewfinder -->
  <div class="flex flex-col items-center">
    <div class="relative w-40 h-40 flex items-center justify-center">

      <!-- Animated scan line -->
      <div class="scanner-line absolute inset-x-3"
           style="background: linear-gradient(90deg, transparent, rgba(225,29,72,0.7), transparent);"></div>

      <!-- Corner markers -->
      <div class="absolute top-0 left-0  w-7 h-7 border-t-2 border-l-2 border-crimson rounded-tl-md"></div>
      <div class="absolute top-0 right-0 w-7 h-7 border-t-2 border-r-2 border-crimson rounded-tr-md"></div>
      <div class="absolute bottom-0 left-0  w-7 h-7 border-b-2 border-l-2 border-crimson rounded-bl-md"></div>
      <div class="absolute bottom-0 right-0 w-7 h-7 border-b-2 border-r-2 border-crimson rounded-br-md"></div>

      <!-- QR-code SVG (decorative) -->
      <svg class="w-24 h-24 text-gray-500" viewBox="0 0 70 70" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <!-- Top-left finder pattern -->
        <rect x="2" y="2" width="20" height="20" rx="2"/>
        <rect x="5" y="5" width="14" height="14" rx="1" style="fill:#0F172A"/>
        <rect x="8" y="8" width="8"  height="8"  rx="1"/>
        <!-- Top-right finder pattern -->
        <rect x="48" y="2" width="20" height="20" rx="2"/>
        <rect x="51" y="5" width="14" height="14" rx="1" style="fill:#0F172A"/>
        <rect x="54" y="8" width="8"  height="8"  rx="1"/>
        <!-- Bottom-left finder pattern -->
        <rect x="2" y="48" width="20" height="20" rx="2"/>
        <rect x="5" y="51" width="14" height="14" rx="1" style="fill:#0F172A"/>
        <rect x="8" y="54" width="8"  height="8"  rx="1"/>
        <!-- Timing dots -->
        <rect x="24" y="8"  width="4" height="4" rx="0.5"/>
        <rect x="32" y="8"  width="4" height="4" rx="0.5"/>
        <rect x="40" y="8"  width="4" height="4" rx="0.5"/>
        <rect x="8"  y="24" width="4" height="4" rx="0.5"/>
        <rect x="8"  y="32" width="4" height="4" rx="0.5"/>
        <rect x="8"  y="40" width="4" height="4" rx="0.5"/>
        <!-- Data modules -->
        <rect x="24" y="24" width="4" height="4" rx="0.5"/>
        <rect x="40" y="24" width="4" height="4" rx="0.5"/>
        <rect x="56" y="24" width="4" height="4" rx="0.5"/>
        <rect x="64" y="24" width="4" height="4" rx="0.5"/>
        <rect x="32" y="32" width="4" height="4" rx="0.5"/>
        <rect x="48" y="32" width="4" height="4" rx="0.5"/>
        <rect x="64" y="32" width="4" height="4" rx="0.5"/>
        <rect x="24" y="40" width="4" height="4" rx="0.5"/>
        <rect x="40" y="40" width="4" height="4" rx="0.5"/>
        <rect x="56" y="40" width="4" height="4" rx="0.5"/>
        <rect x="32" y="48" width="4" height="4" rx="0.5"/>
        <rect x="48" y="48" width="4" height="4" rx="0.5"/>
        <rect x="64" y="48" width="4" height="4" rx="0.5"/>
        <rect x="24" y="56" width="4" height="4" rx="0.5"/>
        <rect x="40" y="56" width="4" height="4" rx="0.5"/>
        <rect x="56" y="56" width="4" height="4" rx="0.5"/>
        <rect x="32" y="64" width="4" height="4" rx="0.5"/>
        <rect x="48" y="64" width="4" height="4" rx="0.5"/>
        <rect x="64" y="64" width="4" height="4" rx="0.5"/>
      </svg>
    </div>
  </div>

  <!-- Input -->
  <div>
    <div class="relative">
      <input type="text" id="bookingCodeInput"
             placeholder="Scan or enter 6-digit Booking ID"
             maxlength="6"
             inputmode="numeric"
             autocomplete="off"
             autofocus
             class="w-full bg-dark-surface border-2 border-dark-border rounded-xl py-4 px-5 pr-24
                    text-white text-xl font-mono placeholder-gray-600
                    focus:outline-none focus:border-crimson focus:ring-1 focus:ring-crimson
                    transition-all text-center tracking-[0.3em]">
      <button onclick="validateBooking()"
              class="absolute right-2 top-1/2 -translate-y-1/2 bg-crimson hover:bg-rose-600
                     text-white px-4 py-2.5 rounded-lg font-display font-semibold text-sm transition-colors">
        ADMIT
      </button>
    </div>
    <p class="text-xs text-gray-600 text-center mt-2">
      Physical scanner auto-submits on read — or press Enter
    </p>
  </div>

  <!-- Scan Log (last 3 scans) -->
  <div>
    <div class="flex items-center justify-between mb-3">
      <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Recent Scans</p>
      <p class="text-xs text-gray-600">Last 3 shown</p>
    </div>

    <!-- Empty state (shown until first scan) -->
    <div id="scannerLogsEmpty" class="text-center py-8 text-gray-600">
      <svg class="w-8 h-8 mx-auto mb-2 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
      </svg>
      <p class="text-sm">No scans yet this session</p>
    </div>

    <!-- Log container — populated by JS, max 3 entries -->
    <div id="scannerLogs" class="space-y-2"></div>
  </div>

</div>
