<div class="h-full flex flex-col bg-dark-surface rounded-xl border border-dark-border overflow-hidden shadow-2xl relative">
  <!-- Header -->
  <div class="px-6 py-4 border-b border-dark-border flex items-center justify-between bg-dark-bg">
    <div>
      <h2 class="font-display text-xl font-bold text-white flex items-center gap-2">
        <svg class="w-5 h-5 text-crimson" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"/>
        </svg>
        <span id="tsMovieName">Select Screening</span>
      </h2>
      <p class="text-sm text-gray-400 mt-1">Select seats for this screening</p>
    </div>
    <button onclick="closeTicketSelector()" class="p-2 text-gray-500 hover:text-white hover:bg-dark-elevated rounded-lg transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Seat Grid (rendered by JS via AJAX) -->
  <div class="flex-1 overflow-y-auto p-6">
    <div id="tsSeatsContainer">
      <div class="text-center text-gray-500 py-8">Select a screening to load seats</div>
    </div>
  </div>

  <!-- Footer Actions -->
  <div class="px-6 py-4 border-t border-dark-border bg-dark-bg flex items-center justify-between">
    <div>
      <p class="text-sm text-gray-400" id="tsSelectedCount">0 seats selected</p>
      <p class="text-xl font-bold text-white" id="tsTotalPrice">$0.00</p>
    </div>
    <div class="flex gap-3">
      <button onclick="closeTicketSelector()" class="px-6 py-2.5 rounded-xl border border-dark-border text-gray-300 hover:bg-dark-elevated hover:text-white transition-colors font-semibold">
        Cancel
      </button>
      <button id="tsAddToCartBtn" onclick="addSelectedTicketsToCart()" disabled
              class="px-6 py-2.5 rounded-xl bg-crimson text-white hover:bg-rose-600 transition-colors font-semibold flex items-center gap-2 opacity-50 cursor-not-allowed">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
        Add to Cart
      </button>
    </div>
  </div>
</div>
