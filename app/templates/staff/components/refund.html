<!-- Staff Refund Panel — 2-step partial refund flow -->
<div id="tool-refund" class="tools-content">

  <!-- ── STEP 1: Booking Code Input ── -->
  <div id="refundStep1">
    <div class="mb-6">
      <h2 class="font-display text-2xl font-bold mb-2">Refund Management</h2>
      <p class="text-gray-400 text-sm">Enter the 6-digit Booking Code from the customer's receipt</p>
    </div>

    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-300 mb-2">Booking Code</label>
      <div class="relative">
        <input type="number" id="refundBookingCode" placeholder="e.g. 162253"
               class="w-full bg-dark-surface border border-dark-border rounded-xl py-3 px-4 pr-12 text-white placeholder-gray-500 focus:outline-none focus:border-crimson focus:ring-1 focus:ring-crimson transition-all [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
        <button onclick="lookUpBooking()" class="absolute right-2 top-1/2 -translate-y-1/2 bg-crimson hover:bg-rose-600 text-white p-2 rounded-lg transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Empty state -->
    <div class="text-center py-12">
      <div class="w-16 h-16 bg-dark-surface rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"/>
        </svg>
      </div>
      <h3 class="font-semibold text-gray-400 mb-1">Enter a Booking Code</h3>
      <p class="text-sm text-gray-500">Type the 6-digit code printed on the customer's receipt</p>
    </div>
  </div>

  <!-- ── STEP 2: Ticket Selection ── -->
  <div id="refundStep2" class="hidden">

    <!-- Booking info card -->
    <div class="bg-dark-surface border border-dark-border rounded-xl p-4 mb-5">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs text-gray-500 uppercase tracking-wider">Booking</span>
        <span class="font-mono font-bold text-crimson text-lg" id="r2BookingCode">—</span>
      </div>
      <p class="font-semibold text-white text-sm" id="r2Movie">—</p>
      <p class="text-xs text-gray-400 mt-0.5" id="r2Time">—</p>
      <div class="flex items-center justify-between mt-3 pt-3 border-t border-dark-border">
        <span class="text-xs text-gray-500">Current Total</span>
        <span class="font-bold text-white" id="r2Total">$0.00</span>
      </div>
    </div>

    <!-- Ticket checkboxes -->
    <div class="mb-5">
      <p class="text-sm font-medium text-gray-300 mb-3">Select seats to refund:</p>
      <div id="r2TicketList" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
    </div>

    <!-- Select all toggle -->
    <label class="flex items-center gap-2 text-sm text-gray-400 cursor-pointer mb-5">
      <input type="checkbox" id="r2SelectAll" onchange="toggleSelectAllRefund(this.checked)"
             class="w-4 h-4 rounded border-dark-border bg-dark-bg text-crimson focus:ring-crimson">
      Select all seats
    </label>

    <!-- Action buttons -->
    <div class="flex gap-3">
      <button onclick="resetRefundPanel()"
              class="flex-1 py-3 border border-dark-border rounded-xl text-gray-400 hover:text-white hover:border-gray-500 transition-all text-sm font-medium">
        Back
      </button>
      <button onclick="processPartialRefund()"
              class="flex-1 bg-crimson hover:bg-rose-600 text-white font-semibold py-3 rounded-xl transition-all flex items-center justify-center gap-2 text-sm">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
        </svg>
        Process Refund
      </button>
    </div>
  </div>

  <!-- ── SUCCESS STATE ── -->
  <div id="refundSuccess" class="hidden text-center py-8">
    <div class="w-16 h-16 bg-green-500 rounded-full flex items-center justify-center mx-auto mb-4">
      <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <h3 class="font-display text-xl font-bold text-white mb-1">Refund Processed</h3>
    <p class="text-gray-400 text-sm mb-1" id="rSuccessMsg">—</p>
    <p class="text-xs text-gray-500 mb-6" id="rSuccessSeats">—</p>
    <button onclick="resetRefundPanel()"
            class="w-full bg-dark-surface hover:bg-dark-elevated border border-dark-border text-white font-semibold py-3 rounded-xl transition-all text-sm">
      New Refund
    </button>
  </div>

</div>
