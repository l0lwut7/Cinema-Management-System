<!-- Persistent Order Panel (Right Side) -->
<div class="flex flex-col h-full">

  <!-- Header -->
  <div class="flex items-center justify-between px-5 py-4 border-b border-dark-border flex-shrink-0">
    <h3 class="font-display font-bold text-lg tracking-wide">CURRENT ORDER</h3>
    <button onclick="clearCart()" class="text-xs text-gray-500 hover:text-crimson transition-colors flex items-center gap-1">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
      </svg>
      Clear All
    </button>
  </div>

  <!-- Cart Items (scrollable) -->
  <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-2">
    <div class="text-center text-gray-600 py-10 text-sm">
      <svg class="w-10 h-10 mx-auto mb-3 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
      </svg>
      <p class="text-gray-500">Cart is empty</p>
      <p class="text-xs text-gray-700 mt-1">Tap items to add</p>
    </div>
  </div>

  <!-- Totals + Payment (fixed at bottom) -->
  <div class="flex-shrink-0 border-t border-dark-border p-4 space-y-3">
    <!-- Totals -->
    <div class="space-y-1.5">
      <div class="flex justify-between text-sm text-gray-400">
        <span>Subtotal</span><span id="subtotal">$0.00</span>
      </div>
      <div class="flex justify-between text-sm text-gray-400">
        <span>Tax (8.5%)</span><span id="tax">$0.00</span>
      </div>
      <div class="flex justify-between font-bold text-base pt-2 border-t border-dark-border">
        <span>Total</span>
        <span class="text-crimson" id="total">$0.00</span>
      </div>
    </div>

    <!-- Payment Buttons -->
    <div class="grid grid-cols-3 gap-2 pt-1">
      <button onclick="processPayment('cash')"
              class="pos-btn bg-green-600 hover:bg-green-500 text-white font-semibold py-3 rounded-xl transition-all flex flex-col items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/>
        </svg>
        <span class="text-xs">CASH</span>
      </button>
      <button onclick="processPayment('card')"
              class="pos-btn bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition-all flex flex-col items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
        </svg>
        <span class="text-xs">CARD</span>
      </button>
      <button onclick="processPayment('mobile')"
              class="pos-btn bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3 rounded-xl transition-all flex flex-col items-center gap-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>
        </svg>
        <span class="text-xs">MOBILE</span>
      </button>
    </div>
  </div>
</div>
