<!-- Persistent Order Panel (Right Side) -->
<div class="flex flex-col h-full overflow-hidden">

  <!-- ── CART VIEW ─────────────────────────────── -->
  <div id="cartView" class="flex flex-col flex-1 overflow-hidden">

    <!-- Header -->
    <div class="flex items-center justify-between px-5 py-4 border-b border-dark-border flex-shrink-0">
      <h3 class="font-display font-bold text-lg tracking-wide">CURRENT ORDER</h3>
      <button onclick="clearCart()" class="text-xs text-gray-500 hover:text-crimson transition-colors flex items-center gap-1">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
        Clear All
      </button>
    </div>

    <!-- Cart Items (scrollable) -->
    <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-2">
      <div class="text-center text-gray-600 py-10 text-sm">
        <svg class="w-10 h-10 mx-auto mb-3 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
        </svg>
        <p class="text-gray-500">Cart is empty</p>
        <p class="text-xs text-gray-700 mt-1">Tap items to add</p>
      </div>
    </div>

    <!-- Totals + Payment (fixed at bottom) -->
    <div class="flex-shrink-0 border-t border-dark-border p-4 space-y-3">
      <div class="space-y-1.5">
        <div class="flex justify-between text-sm text-gray-400">
          <span>Subtotal</span><span id="subtotal">$0.00</span>
        </div>
        <div class="flex justify-between text-sm text-gray-400">
          <span>Tax (8.5%)</span><span id="tax">$0.00</span>
        </div>
        <div class="flex justify-between font-bold text-base pt-2 border-t border-dark-border">
          <span>Total</span>
          <span class="text-crimson" id="total">$0.00</span>
        </div>
      </div>

      <!-- Payment Buttons -->
      <div class="grid grid-cols-3 gap-2 pt-1">
        <button onclick="processPayment('cash')"
                class="pos-btn bg-green-600 hover:bg-green-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-xl transition-all flex flex-col items-center gap-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
          <span class="text-xs">CASH</span>
        </button>
        <button onclick="processPayment('card')"
                class="pos-btn bg-blue-600 hover:bg-blue-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-xl transition-all flex flex-col items-center gap-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
          </svg>
          <span class="text-xs">CARD</span>
        </button>
        <button onclick="processPayment('mobile')"
                class="pos-btn bg-purple-600 hover:bg-purple-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-xl transition-all flex flex-col items-center gap-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/>
          </svg>
          <span class="text-xs">MOBILE</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ── SUCCESS VIEW (hidden until checkout completes) ──────── -->
  <div id="checkoutSuccess" class="hidden flex-col flex-1 overflow-hidden">

    <!-- Scrollable content -->
    <div class="flex-1 overflow-y-auto p-6 flex flex-col items-center">

      <!-- Green check -->
      <div class="w-20 h-20 bg-green-500 rounded-full flex items-center justify-center mb-5 shadow-lg shadow-green-500/30 flex-shrink-0">
        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
        </svg>
      </div>

      <h2 class="font-display text-2xl font-bold text-white tracking-wide mb-1">BOOKING CONFIRMED</h2>
      <p class="text-gray-400 text-sm mb-6">
        Paid via <span id="successMethod" class="text-white font-semibold">CASH</span>
      </p>

      <!-- Booking ID -->
      <div class="w-full bg-dark-bg rounded-xl p-4 mb-3 text-center">
        <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">Booking ID</p>
        <p class="font-display text-4xl font-bold text-crimson" id="successBookingId">—</p>
      </div>

      <!-- Total charged -->
      <div class="w-full bg-dark-bg rounded-xl p-4 mb-5 text-center">
        <p class="text-xs text-gray-500 uppercase tracking-wider mb-1">Total Charged</p>
        <p class="text-2xl font-bold text-white" id="successTotal">$0.00</p>
      </div>

      <!-- Ticket IDs -->
      <div class="w-full">
        <p class="text-xs text-gray-500 uppercase tracking-wider mb-3 text-center">
          Ticket IDs — give these to the customer
        </p>
        <div id="successTicketIds" class="grid grid-cols-2 gap-2">
          <!-- populated by JS -->
        </div>
      </div>
    </div>

    <!-- New Order button (pinned at bottom) -->
    <div class="flex-shrink-0 p-4 border-t border-dark-border">
      <button onclick="resetCheckout()"
              class="w-full bg-crimson hover:bg-rose-600 text-white font-bold py-3.5 rounded-xl transition-all font-display tracking-widest text-sm">
        NEW ORDER
      </button>
    </div>
  </div>

</div>
